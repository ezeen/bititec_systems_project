# .github/workflows/deploy.yml

name: CI/CD for BITITECSYSTEM Backend & EmailServer

# Trigger on pushes to main branch for backend/ and emailserver/ directories
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'

jobs:
  # Test job - runs Django tests with PostgreSQL
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-secret-key-for-testing
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: 'bit_app.settings'  # Replace with your actual settings module
        run: |
          python manage.py migrate
          python manage.py test

  # Deploy job - only runs on successful tests and main branch pushes
  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection successful'"
          
      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "🚀 Starting deployment process..."
            
            # Navigate to your project directory
            cd ${{ secrets.SERVER_PATH }}
            
            # Pull latest changes from main branch
            echo "📦 Pulling latest changes..."
            git pull origin main
            
            # Load environment variables if you have them
            if [ -f /home/bititec_server/shared/scripts/load_env.sh ]; then
              echo "🔧 Loading environment variables..."
              source /home/bititec_server/shared/scripts/load_env.sh
            fi
            
            # Navigate to docker-compose directory
            cd shared
            
            echo "🛑 Stopping services..."
            # Stop the services gracefully
            docker-compose stop backend_bititecsystems emailserver_bititecsystems
            
            echo "🔨 Building updated images..."
            # Rebuild the images with no cache to ensure fresh build
            docker-compose build --no-cache backend_bititecsystems emailserver_bititecsystems
            
            echo "🚀 Starting services..."
            # Start the services
            docker-compose up -d backend_bititecsystems emailserver_bititecsystems db_bititecsystems
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 45
            
            # Check if backend container is running before executing commands
            if docker-compose ps backend_bititecsystems | grep -q "Up"; then
              echo "✅ Backend container is running"
              
              echo "🗄️ Running database migrations..."
              # Make and apply migrations
              docker-compose exec -T backend_bititecsystems python manage.py makemigrations
              docker-compose exec -T backend_bititecsystems python manage.py migrate
              
              echo "📁 Collecting static files..."
              # Collect static files
              docker-compose exec -T backend_bititecsystems python manage.py collectstatic --noinput
              
              echo "🔄 Restarting services to ensure everything is fresh..."
              # Restart all services to ensure everything is properly connected
              docker-compose restart backend_bititecsystems emailserver_bititecsystems
              
            else
              echo "❌ Backend container failed to start!"
              docker-compose logs backend_bititecsystems
              exit 1
            fi
            
            # Optional: Restart nginx if you have it in your docker-compose
            if docker-compose ps nginx | grep -q "nginx"; then
              echo "🔄 Restarting nginx..."
              docker-compose restart nginx
            fi
            
            echo "📊 Final status check..."
            docker-compose ps
            
            echo "✅ Deployment completed successfully!"
          EOF

  # Optional: Send notification on deployment status
  notify:
    name: Send Notification
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Send notification on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful! Your server has been updated."
          
      - name: Send notification on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed! Check the logs for details."