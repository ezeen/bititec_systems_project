name: CI/CD for BITITECSYSTEM Backend & EmailServer

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-secret-key-for-testing
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: 'bit_app.settings'
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    name: Deploy to Local Production Server via VPS Tunnel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "🔧 Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test connection to VPS
        run: |
          echo "🧪 Testing SSH connection to VPS..."
          ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo '✅ Connected to VPS'"

      - name: Deploy to Local Production via Reverse Tunnel
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "🌐 VPS Connected — Tunneling into Local Production..."

            # SSH into local production machine through the reverse tunnel
            ssh -i /home/bititec_server/.ssh/id_rsa_autossh -p 2222 -o StrictHostKeyChecking=no bititec_server@localhost << 'EOL'

              echo "🚀 Starting deployment on LOCAL machine..."

              cd ~/shared

              echo "📦 Pulling latest changes..."
              git pull origin main

              echo "🛑 Stopping containers..."
              docker compose down

              echo "🧹 Cleaning up..."
              docker system prune -f -a --volumes -y

              echo "🔨 Building containers..."
              docker compose build --no-cache

              echo "🚀 Starting up services..."
              docker compose up -d nginx backend_bititecsystems emailserver_bititecsystems db_bititecsystems

              echo "⏳ Waiting for services..."
              sleep 30

              echo "📁 Running migrations & collectstatic..."
              docker compose exec -T backend_bititecsystems python manage.py migrate
              docker compose exec -T backend_bititecsystems python manage.py collectstatic --noinput

              echo "🔄 Restarting services..."
              docker compose restart backend_bititecsystems emailserver_bititecsystems

              echo "✅ Deployment finished on LOCAL machine."

            EOL
          EOF

  notify:
    name: Send Notification
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        run: echo "✅ Deployment successful!"

      - name: Notify Failure
        if: needs.deploy.result == 'failure'
        run: echo "❌ Deployment failed. Check logs."
