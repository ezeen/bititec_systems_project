name: CI/CD for BITITECSYSTEM Backend & EmailServer

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-secret-key-for-testing
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: 'bit_app.settings'
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          echo "🔧 Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test SSH Connection
        run: |
          echo "🧪 Testing SSH connection to VPS..."
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo '✅ SSH connection successful'"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "🚀 Starting deployment..."

            cd ${{ secrets.SERVER_PATH }}

            echo "📦 Pulling latest changes..."
            git reset --hard HEAD
            git pull origin main

            echo "📁 Syncing backend files..."
            mkdir -p bititecsystems/backend
            rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' backend/ bititecsystems/backend/

            echo "📁 Syncing emailserver files..."
            mkdir -p bititecsystems/emailserver
            rsync -av --delete --exclude='__pycache__' --exclude='*.pyc' emailserver/ bititecsystems/emailserver/

            cd "$HOME/shared"

            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ docker-compose.yml not found!"
              exit 1
            fi

            echo "🛑 Stopping running containers..."
            docker compose stop backend_bititecsystems emailserver_bititecsystems
            docker compose down --remove-orphans
            docker system prune -f

            echo "🔨 Rebuilding images..."
            docker compose build --no-cache backend_bititecsystems emailserver_bititecsystems

            echo "🚀 Starting containers..."
            docker compose up -d nginx backend_bititecsystems emailserver_bititecsystems db_bititecsystems

            echo "⏳ Waiting for services to come up..."
            sleep 45

            if docker compose ps backend_bititecsystems | grep -q "Up"; then
              echo "✅ Backend container is running"

              echo "🔍 Existing migrations:"
              docker compose exec -T backend_bititecsystems ls -l backend/bititec/migrations || echo "⚠️ No migration files found"

              echo "🗄️ Applying migrations..."
              docker compose exec -T backend_bititecsystems python manage.py migrate

              echo "📁 Collecting static files..."
              docker compose exec -T backend_bititecsystems python manage.py collectstatic --noinput

              echo "🔄 Restarting containers..."
              docker compose restart backend_bititecsystems emailserver_bititecsystems

              echo "📊 Final container status:"
              docker compose ps
            else
              echo "❌ Backend container failed to start"
              docker compose logs backend_bititecsystems
              exit 1
            fi

            echo "🧹 Cleaning backups..."
            cd ../bititecsystems
            ls -t backend_backup_* 2>/dev/null | tail -n +4 | xargs rm -rf || true
            ls -t emailserver_backup_* 2>/dev/null | tail -n +4 | xargs rm -rf || true

            echo "✅ Deployment finished!"
          EOF

  notify:
    name: Send Notification
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Send notification on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful!"

      - name: Send notification on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed. Check the logs."
