# .github/workflows/deploy.yml

name: CI/CD for BITITECSYSTEM Backend & EmailServer

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'emailserver/**'
      - '.github/workflows/deploy.yml'

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test-key
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: bit_app.settings
        run: |
          python manage.py migrate
          python manage.py test

  deploy:
    name: Deploy via Tunnel to Local Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}"  | tr -d '\r' > ~/.ssh/deploy_key
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key
          echo "✅ SSH key written"

      - name: Add VPS host to known_hosts
        run: |
          ssh-keyscan -p 2222 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true

      - name: Test SSH connection to local server through VPS tunnel
        run: |
          ssh -v -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo '✅ Connected to local server via reverse tunnel'; whoami"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "🚀 Starting deployment on local server..."

            cd ${{ secrets.SERVER_PATH }}
            git stash
            git reset --hard HEAD
            git pull origin main

            cd ~/shared
            docker compose down
            docker system prune -f
            docker compose build --no-cache
            docker compose up -d

            echo "✅ Rebuilding backend..."
            docker compose exec -T backend_bititecsystems python manage.py migrate
            docker compose exec -T backend_bititecsystems python manage.py collectstatic --noinput

            echo "✅ Deployment complete!"
          EOF

  notify:
    name: Send Notification
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify Success
        if: needs.deploy.result == 'success'
        run: echo "✅ Deployment successful!"

      - name: Notify Failure
        if: needs.deploy.result == 'failure'
        run: echo "❌ Deployment failed. Check logs."
